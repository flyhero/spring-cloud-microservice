server:
  port: 8081

spring:
  application:
    name: gateway-service

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

#  config:
#    import:
#      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
#      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  cloud:
    gateway:
      enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
#          filters:
#            - StripPrefix=2
          metadata:
            title: 用户服务

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**
          metadata:
            title: 订单服务

        - id: program-service
          uri: lb://program-service
          predicates:
            - Path=/program/**
          metadata:
            title: 订单服务

    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false

gateway:
  skip-token-paths:
    - /user/login
    - /order/test
    - /order/test2
    - /order/test/**
    - /order/test4
    - /program/**